# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews PRs alongside SonarCloud and Sourcery (see AGENTS.md, "Before opening a PR").
# On the OSS plan, a repository with fewer than 10 stars gets reviews only on request:
# comment `@coderabbitai review` on the PR.
language: en-US

reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Stacked PRs target the previous branch in the stack, not only main.
    base_branches:
      - ".*"
  # Generated or machine-maintained files: reviewing them spends the per-review file limit.
  path_filters:
    - "!gradle/verification-metadata.xml"
    - "!gradle/verification-keyring.keys"
    - "!gradle/wrapper/**"
  path_instructions:
    - path: "**/*.java"
      instructions: >-
        Check the change against .github/REVIEW_CHECKLIST.md: failure and cleanup paths,
        concurrency and configuration reload, protocol size limits, hostile input,
        extension boundaries, and tests that would still pass if the code were wrong.
    - path: "specs/**"
      instructions: >-
        Spec-kit documents. Check that claims match the code and tests in the PR,
        and that spec, plan, tasks and contracts agree with each other.

  pre_merge_checks:
    # The built-in docstring check has no path filter, so it counts test methods, test helpers
    # and CI scripts too. Replaced by the custom check below, scoped to production Java.
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Production Javadoc coverage"
        mode: warning
        instructions: >-
          Consider only Java files under a `src/main/java/` directory that this PR adds or
          modifies. Ignore everything else, including `src/test/`, `src/integrationTest/`,
          `jircd-integration-tests/`, build scripts, workflows and `.github/scripts/`.
          In those files, list each public or protected class, interface, record, enum,
          constructor and method that the PR adds or whose signature it changes. Exclude
          methods annotated `@Override` and record accessors. Pass if every listed element
          has a Javadoc comment, or if nothing is listed. Otherwise fail and name each
          element without Javadoc.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - ".github/REVIEW_CHECKLIST.md"
      - ".specify/memory/constitution.md"
