name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # SonarCloud wants full history for blame/new-code analysis.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and verify
        run: ./gradlew build testCodeCoverageReport --stacktrace

      - name: SonarCloud analysis
        # Forked-PR builds don't get repo secrets, so SONAR_TOKEN is empty there.
        if: ${{ env.SONAR_TOKEN != '' }}
        # --no-parallel: the sonar task resolves every subproject's classpath
        # itself and isn't safe under this project's org.gradle.parallel=true
        # (fails with "Resolution of the configuration ... was attempted
        # without an exclusive lock" otherwise).
        run: ./gradlew sonar --no-parallel --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: "**/build/reports/"
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: build/reports/jacoco/testCodeCoverageReport/html/
          retention-days: 7
