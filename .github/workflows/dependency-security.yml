name: Dependency security

# Vulnerability reporting for runtime and build dependencies, no NVD key needed.
#
# - Pull requests: dependency-review-action diffs the dependency graph and fails
#   on newly introduced vulnerable dependencies of severity high or above.
# - Pushes to main: the Gradle dependency graph is submitted to GitHub, which
#   feeds Dependabot alerts for newly disclosed advisories.
#
# Suppression/review process: see "Dependency security" in CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  submit-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # dependency-submission API requires it
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@v5

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Accepted advisories go here, each with a justification comment:
          # allow-ghsas: GHSA-xxxx-xxxx-xxxx
