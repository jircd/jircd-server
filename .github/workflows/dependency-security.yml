name: Dependency security

# Vulnerability reporting for runtime and build dependencies, no NVD key needed.
#
# - Pull requests: dependency-review-action diffs the dependency graph and fails
#   on newly introduced vulnerable dependencies of severity high or above.
# - Pushes to main: the Gradle dependency graph is submitted to GitHub, which
#   feeds Dependabot alerts for newly disclosed advisories.
#
# Suppression/review process: see "Dependency security" in CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  submit-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: dependency-graph-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write # dependency-submission API requires it
    steps:
      # Dependabot's github-actions entry keeps these SHA pins updated.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Accepted advisories go here, each with a justification comment:
          # allow-ghsas: GHSA-xxxx-xxxx-xxxx
