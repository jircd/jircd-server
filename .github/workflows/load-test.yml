name: Load tests

# Timing-sensitive tests tagged `load` are excluded from `test`/`build`; run them weekly and on demand.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run load tests
        run: ./gradlew loadTest --stacktrace

      - name: Upload reports and test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: load-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
